name: Poetics CI
on:
  push:
    branches: [main, 'poetics/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poetics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard tracked private files
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in filter(None, files):
              p = pathlib.PurePosixPath(name)
              if any(x == '.env' or x.startswith('.env.') for x in p.parts) or p.suffix.lower() in ('.pem','.key','.pfx','.p12','.dump'):
                  raise SystemExit('Forbidden tracked private file: ' + name)
          PY
      - name: Build and run app verification
        run: python3 -X utf8 scripts/sync-localwp.py --verify-only
      - name: Run every regression suite
        run: |
          for suite in test-*.cjs; do node "$suite"; done
          for suite in test-*.py; do PYTHONUTF8=1 python3 -X utf8 "$suite"; done
      - name: Fail on build drift, including untracked generated assets
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERROR: Build produced untracked files. Regenerate and commit the delivery assets."
            git ls-files --others --exclude-standard
            exit 1
          fi
